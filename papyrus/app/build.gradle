plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.papyrus'
    compileSdk 34

    defaultConfig {
        applicationId "com.papyrus"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "BUILD_REV", "\"${project.findProperty('buildRev') ?: 'dev'}\""
    }

    buildTypes {
        debug {
            // Aucune minification : ce projet n'est jamais distribué, et un
            // symbole obscurci dans une trace coûterait plus cher que les
            // quelques mégaoctets économisés.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        // Imposé par Kotlin 1.9.24 : chaque version du compilateur Kotlin
        // n'accepte qu'une version précise de cette extension, et l'erreur qui
        // en découle ne désigne jamais la vraie cause.
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    // Fondation seule, sans Material : l'écran est un fond, un texte et un
    // défilement. Material apporterait un thème, des composants et une palette
    // dont rien ici ne se sert.
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'

    // La chaîne de défilement n'importe rien d'Android : elle se vérifie donc
    // sur la machine qui compile, en quelques secondes, sans émulateur ni
    // appareil. C'est ce qui rend ces essais assez rapides pour être lancés à
    // chaque compilation plutôt qu'oubliés.
    testImplementation 'junit:junit:4.13.2'
}
