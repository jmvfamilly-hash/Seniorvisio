// Projet Gradle autonome, volontairement séparé de celui de Senior Visio :
// c'est un banc d'essai, il ne doit rien partager avec l'application qui tourne
// chez Jean — ni dépendances, ni réglages, ni chaîne de compilation.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Papyrus"
include ':app'
