plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.seniorvisio'
    compileSdk 34

    defaultConfig {
        applicationId "com.seniorvisio"
        minSdk 26          // Android 8.0 min (BLE/FCM/foreground service modernes)
        targetSdk 34
        versionCode 1
        versionName "0.1-dev"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Notifications push silencieuses pour déclencher l'appel (module 'service')
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // TODO module 'calling' : ajouter ici la dépendance WebRTC / Agora / Stream
    // selon le choix retenu après les premiers tests (voir CallEngine.kt)
}
