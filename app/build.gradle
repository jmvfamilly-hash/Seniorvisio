plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// N'active le plugin Firebase que si google-services.json est présent, pour
// que le build reste vert avant même que le projet Firebase soit créé
// (voir README > Configuration Firebase).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.seniorvisio'
    compileSdk 34

    defaultConfig {
        applicationId "com.seniorvisio"
        minSdk 26          // Android 8.0 min (BLE/FCM/foreground service modernes)
        targetSdk 34
        versionCode 1
        versionName "0.1-dev"
        // Passé par la CI (-PbuildRev=revNN, même numéro que le nom du fichier
        // APK publié) pour afficher discrètement quelle version tourne sur la
        // tablette — utile pour diagnostiquer un déploiement Headwind qui n'a
        // pas encore pris effet, sans avoir à brancher la tablette.
        buildConfigField "String", "BUILD_REV", "\"${project.findProperty('buildRev') ?: "dev"}\""

        // Clé AssemblyAI par défaut, injectée par la CI depuis le secret GitHub
        // ASSEMBLYAI_API_KEY (voir workflow build-debug-apk.yml) — évite de
        // devoir la saisir à la main dans le panneau admin sur la tablette.
        // Reste modifiable là-bas pour une clé différente (voir AdminConfig).
        buildConfigField "String", "ASSEMBLYAI_API_KEY_DEFAULT", "\"${project.findProperty('assemblyAiApiKey') ?: ""}\""

        // Second service de transcription payant (voir
        // GladiaStreamingTranscriber), injecté depuis le secret GitHub
        // GLADIA_API_KEY. Absent du dépôt, le champ vaut la chaîne vide et le
        // moteur refuse simplement de démarrer en le disant — exactement
        // comme AssemblyAI sans clé.
        buildConfigField "String", "GLADIA_API_KEY_DEFAULT", "\"${project.findProperty('gladiaApiKey') ?: ""}\""

        // Clé d'accès Picovoice, pour la reconnaissance de locuteur Eagle (voir
        // EagleSpeakerRecogniser), injectée depuis le secret GitHub
        // PICOVOICE_ACCESS_KEY. Absente, le champ vaut la chaîne vide et le
        // moteur refuse de démarrer en le disant — le moteur intégré reste
        // disponible et ne demande aucune clé.
        buildConfigField "String", "PICOVOICE_ACCESS_KEY_DEFAULT", "\"${project.findProperty('picovoiceAccessKey') ?: ""}\""

        // Clé de chiffrement de la trace de reconnaissance (voir
        // TranscriptionTrace), injectée depuis le secret GitHub
        // SPEECH_TRACE_KEY.
        //
        // Elle ne protège pas un service : elle protège ce que Jean dit chez
        // lui. La trace transite par un Firestore dont les règles laissent
        // lire quiconque connaît l'adresse d'un document ; sans cette clé, un
        // transcript de sa chambre y serait déposé en clair.
        //
        // Absente, la trace s'enregistre mais n'est JAMAIS publiée, et l'état
        // envoyé au panneau d'administration le dit. Publier en clair faute de
        // clé serait précisément l'accident qu'on cherche à éviter, et il
        // passerait inaperçu puisque tout aurait l'air de fonctionner.
        buildConfigField "String", "SPEECH_TRACE_KEY", "\"${project.findProperty('speechTraceKey') ?: ""}\""

        // Rien d'équivalent pour la météo : wttr.in ne demande aucune clé API
        // (voir WeatherClient). Le secret WEATHER_API_KEY et son champ admin
        // ont donc disparu — un compte à créer, une clé à saisir sur la
        // tablette et une clé qui expire un jour sans prévenir étaient trois
        // occasions de panne pour une information d'appoint.
    }

    // Sans ça, chaque build CI (VM GitHub Actions neuve à chaque run) signe
    // avec une clé debug aléatoire différente : Android Gradle Plugin génère
    // par défaut un ~/.android/debug.keystore s'il n'en trouve pas, mais son
    // emplacement exact s'est révélé peu fiable sur ce runner (constaté en
    // test réel : le fichier n'existait tout simplement pas à l'endroit
    // attendu une fois le build terminé, rendant impossible toute mise en
    // cache). Un keystore explicite et versionné dans le dépôt (voir
    // debug.keystore, mêmes alias/mot de passe que la clé debug standard
    // d'Android, sans enjeu de confidentialité pour une signature de test)
    // garantit la même signature à chaque build, quel que soit
    // l'environnement CI — condition nécessaire pour un "adb install -r" en
    // place sur une tablette déjà provisionnée en Device Owner.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    // ═══ DEUX ENVIRONNEMENTS, ET AUCUN PONT ENTRE EUX ═══
    //
    // La tablette de Jean est en service chez lui. Toute mise au point doit
    // donc se faire ailleurs, sur une seconde tablette — et « ailleurs »
    // n'est pas une intention, c'est une propriété du code : les deux
    // variantes n'écrivent pas dans les mêmes documents Firestore, ne
    // s'appellent pas par la même collection, et ne peuvent pas se réveiller
    // l'une l'autre.
    //
    // Ce qui les sépare tient en quatre champs, et chacun ferme un chemin
    // précis par lequel un essai pourrait atteindre le salon de Jean :
    //
    //   DEVICE_ID           le document d'appareil. C'est là que la tablette
    //                       dépose son jeton de notification. Partagé, une
    //                       tablette d'essai VOLERAIT les appels de Jean en
    //                       écrasant le sien — la panne la plus grave que ce
    //                       montage puisse produire, et la plus silencieuse.
    //   CALLS_COLLECTION    la boîte aux lettres des appels. Partagée, un
    //                       essai ferait sonner sa tablette.
    //   KIOSK_ENABLED       le verrouillage kiosque et le masquage de la
    //                       barre de navigation. Sur un appareil d'essai on
    //                       doit pouvoir sortir de l'appli.
    //   ENVIRONMENT         affiché à l'écran, pour qu'on sache toujours
    //                       laquelle des deux on a sous les yeux.
    //
    // MÊME applicationId POUR LES DEUX, DÉLIBÉRÉMENT. google-services.json ne
    // déclare qu'un seul package, et il n'est pas modifiable à la main : ses
    // valeurs sont générées par la console Firebase. Un suffixe imposerait
    // d'enregistrer une seconde application et de régénérer ce fichier, pour
    // un bénéfice nul ici — les deux variantes vivent sur deux tablettes
    // différentes, et n'ont jamais à cohabiter sur la même.
    flavorDimensions += "environnement"
    productFlavors {
        production {
            dimension "environnement"
            buildConfigField "String", "ENVIRONMENT", "\"production\""
            buildConfigField "String", "DEVICE_ID", "\"jean_tablet\""
            buildConfigField "String", "CALLS_COLLECTION", "\"calls\""
            buildConfigField "boolean", "KIOSK_ENABLED", "true"
            // VIDE PAR DÉFAUT — UN RÉGLAGE D'USINE, PAS UN VERROU.
            //
            // Un fil d'information qui apparaîtrait de lui-même sur la
            // tablette de Jean serait un changement d'écran que personne ne
            // lui a demandé, et il n'a aucun moyen de le faire disparaître.
            // D'où cette valeur vide : à la sortie d'usine, la fonction est
            // éteinte.
            //
            // CE COMMENTAIRE A PROMIS PLUS QUE ÇA, ET C'ÉTAIT FAUX.
            //
            // Il disait « l'adresse vide éteint la fonction entièrement » et
            // « le jour où on la voudra chez lui, c'est cette ligne, et elle
            // seule ». C'était vrai quand il a été écrit. Ça ne l'est plus
            // depuis que le PWA sait écrire la liste des fils :
            //
            //     RafraichisseurFlux.adresses() :
            //     config.fluxActualites.takeIf { it.isNotBlank() }
            //         ?: BuildConfig.FLUX_ACTUALITES
            //
            // Le réglage distant PASSE DEVANT. Remplir le champ dans le
            // panneau d'administration de production allume donc le fil chez
            // Jean, sans reconstruire quoi que ce soit.
            //
            // C'est un choix assumé — l'administrateur doit pouvoir décider
            // sans build — et il est laissé tel quel. Ce qui ne pouvait pas
            // rester, c'est un commentaire annonçant une garantie que le code
            // ne tient pas : on s'y fie pour ne PAS vérifier ailleurs, et
            // c'est exactement comme ça qu'un écran finit par apparaître chez
            // quelqu'un qui ne l'a pas demandé.
            buildConfigField "String", "FLUX_ACTUALITES", "\"\""
        }
        validation {
            dimension "environnement"
            buildConfigField "String", "ENVIRONMENT", "\"validation\""
            buildConfigField "String", "DEVICE_ID", "\"test_tablet\""
            buildConfigField "String", "CALLS_COLLECTION", "\"calls_test\""
            buildConfigField "boolean", "KIOSK_ENABLED", "false"
            // UNE LISTE, séparée par des virgules. L'administrateur peut la
            // remplacer à distance sans reconstruire (voir
            // AdminConfig.fluxActualites) ; celle-ci n'est que le défaut
            // livré avec l'APK.
            buildConfigField "String", "FLUX_ACTUALITES", "\"https://www.francetvinfo.fr/titres.rss\""
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        // Compose n'est activé QUE pour la visionneuse de photos (voir
        // VisionneusePhotos.kt). Tout le reste de l'application reste en vues
        // Android classiques : on n'ouvre pas un chantier de migration au
        // milieu d'un appareil en service chez quelqu'un.
        compose true
    }

    // ═══ CETTE VERSION N'EST PAS LIBRE ═══
    //
    // Le compilateur Compose est apparié au compilateur Kotlin, version par
    // version : 1.5.14 est celui de Kotlin 1.9.24, et lui seul. En choisir un
    // autre ne dégrade pas, il refuse de compiler.
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Notifications push silencieuses pour déclencher l'appel (module 'service')
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // Signaling de l'appel (échange de l'offre/réponse SDP + candidats ICE),
    // voir core/signaling/CallSignalingClient.kt
    implementation 'com.google.firebase:firebase-firestore-ktx'

    // Moteur d'appel vidéo : build officiel WebRTC maintenu par la communauté
    // (Google ne publie plus de build prêt à l'emploi depuis 2020), voir
    // core/CallEngine.kt / core/WebRtcCallEngine.kt
    implementation 'io.github.webrtc-sdk:android:144.7559.09'

    // Reconnaissance vocale embarquée, utilisée pour ce qui se dit dans la
    // pièce (voir core/VoskSpeechRecognizer.kt) : gratuite et hors-ligne une
    // fois le modèle téléchargé, ce qui permet d'écouter la pièce toute la
    // journée sans facturation à la durée. Les appels, eux, restent sur
    // AssemblyAI, plus juste — voir core/SpeechRecognizer.kt.
    // Détection d'activité vocale, pour n'ouvrir une session payante que
    // lorsqu'il y a réellement de la VOIX dans la pièce et non un simple bruit
    // (voir core/RoomVoiceGate.kt). Un aspirateur, une porte ou des pas
    // franchissent sans peine un seuil de niveau sonore ; ils ne franchissent
    // pas celui-ci. Modèle d'environ deux mégaoctets, exécuté par ONNX Runtime
    // Mobile, sous licence MIT.
    //
    // Version 2.0.8 et non la dernière : la 2.0.10 est compilée avec Kotlin
    // 2.2, que le compilateur 1.9 de ce projet ne sait pas lire. L'ajouter
    // cassait la compilation du module ENTIER — y compris des fichiers
    // intouchés — avec des erreurs « Class 'kotlin.Unit' was compiled with an
    // incompatible version of Kotlin » qui ne désignent jamais la vraie
    // cause. La 2.0.8 est compilée en 1.9.21.
    //
    // À revoir le jour où ce projet passera à Kotlin 2 : une montée de version
    // du compilateur touche tout ce que Jean utilise, elle mérite d'être faite
    // et vérifiée pour elle-même, pas en passager clandestin d'une
    // fonctionnalité.
    implementation 'com.github.gkonovalov.android-vad:silero:2.0.8'

    // Reconnaissance de locuteur sur l'appareil (voir EagleSpeakerRecogniser).
    // Environ six mégaoctets : un modèle de 4,7 Mo et du code natif pour les
    // quatre architectures. Aucune dépendance déclarée de son côté, ce qui
    // écarte d'emblée le conflit de version de compilateur Kotlin qui a coûté
    // un build à l'intégration de Silero.
    implementation 'ai.picovoice:eagle-android:3.0.2'

    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // Scan de QR Wi-Fi depuis les réglages admin (voir WifiConfigurator.kt) :
    // évite de retaper à la main un SSID/mot de passe sur un écran tactile,
    // source d'erreurs de frappe fréquente. Fournit sa propre Activity de
    // capture caméra, prête à l'emploi (pas besoin de CameraX/ML Kit ici).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    // ═══ TELEPHOTO : LE ZOOM, LE GLISSEMENT ET LES TRANSITIONS ═══
    //
    // Demandé explicitement, et pour la bonne raison : ne pas réinventer des
    // gestes tactiles ni des transitions qu'une bibliothèque fait mieux. Le
    // pincement, la double-tape, l'inertie et le retour aux bords viennent
    // d'ici, pas de nous.
    //
    // Ce qu'elle apporte et qu'on n'aurait pas écrit : le DÉCODAGE PAR TUILES
    // (sub-sampling-image, tiré en dépendance). C'est lui qui rend « garder la
    // résolution d'origine » compatible avec une mémoire bornée — seule la
    // portion visible est décodée, à la finesse où on la regarde. Sans lui,
    // une photo d'appareil moderne en plein cadre, c'est cinquante mégaoctets
    // de pixels pour une dalle qui en affiche deux.
    //
    // ═══ 0.14.0 ET PAS LA DERNIÈRE, POUR LA RAISON DE SILERO ═══
    //
    // La 0.15.0 est compilée avec Kotlin 2.1, que le compilateur 1.9 de ce
    // projet ne sait pas lire. Ce dépôt a déjà payé exactement cette erreur
    // avec Silero : l'ajout cassait la compilation du module ENTIER, fichiers
    // intouchés compris, avec des erreurs qui ne désignent jamais la vraie
    // cause. Vérifié avant de choisir, sur les métadonnées publiées : la
    // 0.14.0 déclare kotlin-stdlib 1.9.24, exactement la nôtre.
    //
    // À revoir le jour où ce projet passera à Kotlin 2 — une montée du
    // compilateur touche tout ce que Jean utilise et mérite d'être faite pour
    // elle-même, pas en passager clandestin.
    //
    // Coil arrive avec elle (coil-compose 2.7.0) : c'est lui qui charge les
    // fichiers, gère le cache et les transitions de chargement.
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'me.saket.telephoto:zoomable-image-coil:0.14.0'

    // WebSocket vers AssemblyAI (transcription temps réel du flux audio
    // distant reçu par l'appel, voir core/AssemblyAiRealtimeTranscriber.kt) :
    // HttpURLConnection (utilisé partout ailleurs dans ce projet) ne gère pas
    // la bascule WebSocket de façon praticable, réimplémenter RFC 6455 à la
    // main serait disproportionné pour une fonction jugée prioritaire.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
