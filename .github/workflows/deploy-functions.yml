name: Deploy Cloud Functions

on:
  push:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json

      # Les trois secrets Twilio (voir functions/index.js,
      # exports.envoyerRappelAidantTest) vivent dans Secret Manager, pas
      # dans ce dépôt — comme FIREBASE_SERVICE_ACCOUNT, mais un cran plus
      # loin : defineSecret() les lit depuis Secret Manager au moment de
      # l'exécution, la fonction ne les reçoit jamais en clair dans son
      # propre code ni dans ses variables d'environnement de déploiement.
      #
      # Réécrits à chaque déploiement de Cloud Functions, qu'ils aient
      # changé ou non : functions:secrets:set est idempotent (il crée une
      # nouvelle version de la même valeur), et c'est plus simple que de
      # détecter un changement pour un coût négligeable.
      - name: Provisionne les secrets Twilio
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        run: |
          printf '%s' "$TWILIO_ACCOUNT_SID" | npx firebase-tools functions:secrets:set TWILIO_ACCOUNT_SID --project seniorvisio --data-file -
          printf '%s' "$TWILIO_AUTH_TOKEN" | npx firebase-tools functions:secrets:set TWILIO_AUTH_TOKEN --project seniorvisio --data-file -
          printf '%s' "$TWILIO_FROM_NUMBER" | npx firebase-tools functions:secrets:set TWILIO_FROM_NUMBER --project seniorvisio --data-file -

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: npx firebase-tools deploy --only functions --project seniorvisio --non-interactive --force
