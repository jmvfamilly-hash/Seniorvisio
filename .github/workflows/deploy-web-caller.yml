name: Deploy web-caller to GitHub Pages

on:
  push:
    branches:
      - claude/android-apk-debug-build-d3zwgj
    paths:
      - 'web-caller/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ═══ CE SITE NE PUBLIE QUE LA PRODUCTION ═══
      #
      # Le banc d'essai a vécu ici un temps, sous /test/. C'était une erreur,
      # et elle se voyait au premier usage : GitHub Pages publie UN artefact
      # qui est le site entier, donc déployer le banc d'essai republiait
      # forcément la production — depuis la branche de travail d'où partait
      # le déploiement.
      #
      # Le banc d'essai est désormais sur Firebase Hosting (voir
      # deploy-test-pwa.yml) : autre hébergeur, et surtout autre ORIGINE. Les
      # deux déploiements n'ont plus rien de commun, et localStorage cesse
      # d'être partagé entre eux — un volume mémorisé pendant un essai ne peut
      # plus rendre Jean muet au prochain appel.
      #
      # La production, elle, n'a pas bougé d'adresse : aucun raccourci
      # d'écran d'accueil cassé chez les proches.
      #
      # La préparation (version affichée, environnement, suffixage des URL
      # contre les caches partiels) est partagée avec le banc d'essai — voir
      # scripts/prepare_pwa.py, et la raison pour laquelle elle ne doit pas
      # être écrite deux fois.
      # Même garde-fou qu'au banc d'essai, et il compte davantage ici : une
      # page publiée sans aucun bouton actif chez les proches, c'est Jean
      # qu'on ne peut plus appeler. Voir scripts/verifie_scripts_pwa.js.
      - name: Vérifie que les scripts du PWA ne se marchent pas dessus
        run: node scripts/verifie_scripts_pwa.js

      - name: Prépare le site de production
        run: |
          python3 scripts/prepare_pwa.py \
            --out site \
            --environment production \
            --version "${GITHUB_SHA::7}"

      - name: Upload le site comme artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print URL
        run: echo "Page URL ${{ steps.deployment.outputs.page_url }}"
