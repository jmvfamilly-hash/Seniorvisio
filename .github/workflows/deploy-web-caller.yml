name: Deploy web-caller to GitHub Pages

on:
  push:
    branches:
      - claude/android-apk-debug-build-d3zwgj
    paths:
      - 'web-caller/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Affiché discrètement en bas de l'écran d'attente (voir index.html,
      # version.js) : seul moyen simple de vérifier qu'un navigateur a bien
      # rechargé la dernière version plutôt qu'une copie mise en cache — sans
      # ça, un correctif qui ne semble "toujours pas marcher" et une page qui
      # n'a en fait jamais rechargé le nouveau code sont indiscernables pour
      # qui teste depuis son téléphone.
      - name: Écrit le commit déployé dans version.js
        run: |
          echo "window.PWA_VERSION = \"${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M UTC')\";" > web-caller/version.js

      # ═══ INDEX.HTML ET APP.JS NE PEUVENT PLUS DIVERGER ═══
      #
      # Les fichiers du PWA étaient demandés par leur nom nu : <script
      # src="app.js">. Le navigateur du proche les met en cache chacun de son
      # côté et les renouvelle quand il veut — rien ne garantit qu'il serve
      # index.html et app.js de la MÊME version.
      #
      # Ce n'est pas une inquiétude de principe : c'est ce qui explique « les
      # modifications ne sont pas toujours prises au redémarrage, des fois
      # oui », et probablement aussi des commandes qui ne répondaient plus.
      # Un identifiant absent d'un index.html périmé suffit à faire tomber
      # tout le câblage JavaScript qui vient après lui.
      #
      # En suffixant chaque fichier local du commit déployé, une nouvelle
      # version change TOUTES les URL d'un coup. Un index.html en cache
      # continue de désigner les fichiers de SA version — cohérents entre eux
      # — et la version suivante arrive en bloc, jamais à moitié. Les scripts
      # externes (gstatic) ne sont pas touchés : ils portent déjà leur numéro
      # de version dans leur chemin.
      - name: Suffixe les fichiers locaux du commit, contre les caches partiels
        run: |
          python3 - <<'PY'
          import re
          version = "${{ github.sha }}"[:7]
          chemin = "web-caller/index.html"
          html = open(chemin, encoding="utf-8").read()

          def suffixer(m):
              attribut, url = m.group(1), m.group(2)
              if url.startswith(("http://", "https://", "//", "data:", "#")):
                  return m.group(0)
              if "?" in url:
                  return m.group(0)
              return f'{attribut}="{url}?v={version}"'

          html, n = re.subn(r'\b(src|href)="([^"]+\.(?:js|css))"', suffixer, html)
          open(chemin, "w", encoding="utf-8").write(html)
          print(f"{n} fichier(s) local(aux) suffixé(s) en ?v={version}")
          PY

      # ═══ DEUX PWA, UNE SEULE PUBLICATION ═══
      #
      # La racine pilote la tablette de Jean, /test/ celle du banc d'essai
      # (voir web-caller/environment.js). Même code exactement : ce qui les
      # distingue tient dans ce seul fichier, réécrit dans la copie.
      #
      # Deux adresses et non un sélecteur dans l'interface : un interrupteur
      # « production / test » suffirait à appeler Jean sur une mauvaise
      # manœuvre, ou sur un réglage mémorisé d'une session à l'autre. Deux
      # adresses ne se confondent pas, et celle du banc d'essai porte en plus
      # un bandeau permanent.
      #
      # La copie est faite APRÈS le suffixage des URL : les deux versions
      # portent donc le même numéro de commit, et un même déploiement ne peut
      # pas laisser l'une en avance sur l'autre.
      # Dossier de publication distinct, et non une copie de web-caller/ dans
      # lui-même : `cp -r web-caller web-caller/test` copie bien, mais rend un
      # code d'erreur (« cannot copy a directory into itself »), et les étapes
      # GitHub Actions tournent en `bash -e` — le déploiement aurait échoué.
      - name: Prépare le site — production à la racine, banc d'essai sous /test/
        run: |
          rm -rf site
          cp -r web-caller site
          mkdir -p site/test
          cp -r web-caller/. site/test/
          cat > site/test/environment.js <<'JS'
          // Réécrit au déploiement (voir deploy-web-caller.yml). L'original,
          // à la racine du site, garde les valeurs de production.
          window.SENIORVISIO_ENV = {
            name: "validation",
            deviceDocId: "test_tablet",
            callsCollection: "calls_test",
          };
          JS
          echo "Racine (production) :"; ls site
          echo "Banc d'essai (/test/) :"; ls site/test
          echo "--- site/test/environment.js ---"; cat site/test/environment.js

      - name: Upload le site comme artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print URL
        run: echo "Page URL ${{ steps.deployment.outputs.page_url }}"
