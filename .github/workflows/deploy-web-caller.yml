name: Deploy web-caller to GitHub Pages

on:
  push:
    branches:
      - claude/android-apk-debug-build-d3zwgj
    paths:
      - 'web-caller/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web-caller as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-caller

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print URL
        run: echo "Page URL ${{ steps.deployment.outputs.page_url }}"
