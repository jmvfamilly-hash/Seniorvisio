name: Preview PWA (canal Firebase Hosting temporaire)

# Publie un commit donné du PWA sur un canal de prévisualisation Firebase
# Hosting, séparé du banc d'essai en direct (seniorvisio-test.web.app) : une
# adresse temporaire, qui expire toute seule, pour regarder une ancienne
# version sans republier quoi que ce soit sur un site que quelqu'un utilise
# peut-être en ce moment pour de vrais tests.
#
# L'ENVIRONNEMENT EST UN CHOIX EXPLICITE, PAS UNE VALEUR PAR DÉFAUT.
#
# « validation » (par défaut si rien n'est précisé) : ce canal ne peut
# joindre que la tablette d'essai, quel que soit le commit prévisualisé —
# même un commit qui a un jour tourné en vraie production.
#
# « production » : demandé explicitement une fois, pour reproduire un
# problème réel en conditions réelles (ex. diagnostiquer pourquoi la
# tablette de Jean ne répond plus). Un appel passé depuis ce canal-là
# sonnera VRAIMENT chez Jean — ce n'est pas un bac à sable.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit (sha complet ou court) ou branche à prévisualiser"
        required: true
      channel:
        description: "Identifiant du canal (minuscules, chiffres, tirets) — forme l'adresse temporaire"
        required: true
      environment:
        description: "validation (tablette d'essai, sûr) ou production (vraie tablette de Jean, appels réels)"
        required: true
        default: "validation"
        type: choice
        options:
          - validation
          - production

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du commit demandé
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifie que les scripts du PWA ne se marchent pas dessus
        run: node scripts/verifie_scripts_pwa.js

      - name: Prépare le PWA (environnement demandé explicitement)
        run: |
          python3 scripts/prepare_pwa.py \
            --out site-test \
            --environment "${{ inputs.environment }}" \
            --version "preview-${{ inputs.channel }}-${{ inputs.ref }}"

      - name: "Garde-fou : l'environnement obtenu est bien celui demandé"
        run: |
          echo "--- site-test/environment.js ---"
          cat site-test/environment.js
          if [ "${{ inputs.environment }}" = "production" ]; then
            grep -q '"production"' site-test/environment.js
            grep -q 'jean_tablet' site-test/environment.js
            echo "⚠️  Ce canal peut réellement appeler la tablette de Jean."
          else
            grep -q '"validation"' site-test/environment.js
            grep -q 'test_tablet' site-test/environment.js
            grep -q 'calls_test' site-test/environment.js
            if grep -q 'jean_tablet' site-test/environment.js; then
              echo "REFUS : ce canal « validation » désigne pourtant la tablette de production." >&2
              exit 1
            fi
          fi

      - name: Déploie sur un canal de prévisualisation temporaire
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json
          npx firebase-tools hosting:channel:deploy "${{ inputs.channel }}" \
            --project seniorvisio --only test --expires 7d --non-interactive \
            | tee /tmp/deploy-output.txt

      - name: Rappeler l'adresse
        run: |
          echo "### Canal de prévisualisation (expire dans 7 jours)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "⚠️ **Environnement production : un appel passé depuis ce lien sonnera réellement chez Jean.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          grep -oE 'https://[a-zA-Z0-9.-]+\.web\.app[a-zA-Z0-9/._-]*' /tmp/deploy-output.txt \
            | sort -u >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit prévisualisé : \`${{ inputs.ref }}\` (environnement : ${{ inputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
