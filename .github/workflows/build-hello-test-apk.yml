name: Build Hello Test APK

# Appli minimale pour isoler la cause d'un échec de provisioning "Device
# Owner" par QR code (voir hello-test/). À supprimer une fois le diagnostic
# terminé.

on:
  push:
    paths:
      - 'hello-test/**'
      - '.github/workflows/build-hello-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hello-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK platform & build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hello-test-apk-${{ github.run_id }}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --title "Hello Test debug APK (run ${{ github.run_number }})" \
            --notes "Test minimal pour isoler le problème de provisioning Device Owner." \
            --target "${{ github.sha }}"
