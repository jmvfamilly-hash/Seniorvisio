name: Deploy test PWA (Firebase Hosting)

# ═══ UNE INFRASTRUCTURE VRAIMENT DISTINCTE, SANS COMPTE NI FACTURE EN PLUS ═══
#
# Le banc d'essai est publié sur Firebase Hosting, la production reste sur
# GitHub Pages. Deux hébergeurs, donc deux ORIGINES — et c'est l'origine qui
# compte, pas le chemin :
#
#   - un déploiement d'essai ne peut plus toucher la production. Ce n'est plus
#     une question de discipline ou de branche : ce sont deux services
#     différents, deux workflows, deux artefacts sans rien de commun ;
#   - localStorage est cloisonné par origine. Les réglages mémorisés,
#     l'identité de l'appelant et les photos du diaporama cessent d'être
#     partagés entre essai et production. Un volume descendu à zéro puis
#     « mémorisé » pendant un essai ne peut plus rendre Jean muet au prochain
#     appel — c'est exactement le défaut qui a coûté une semaine de recherche ;
#   - le PWA installé est une application distincte, avec son propre nom.
#
# COÛT : aucun compte à créer, aucun secret à ajouter. Le projet Firebase est
# déjà sur le plan Blaze (les Cloud Functions v2 l'exigent), donc l'hébergement
# multi-sites est disponible, et le quota gratuit — 10 Go de stockage, 360 Mo
# de transfert par jour — représente plusieurs milliers de chargements
# quotidiens pour une page de 64 Ko. L'usage réel n'en approche pas.

on:
  push:
    branches:
      - validation
    paths:
      - 'web-caller/**'
      - 'scripts/prepare_pwa.py'
      - 'maquettes/**'
      - 'scripts/enveloppe_maquette.py'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-test-pwa.yml'
  # Depuis n'importe quelle branche : éprouver un travail en cours sans avoir
  # à le fusionner d'abord, c'est tout l'intérêt d'un banc d'essai.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Exactement la même préparation que la production, au jeu de documents
      # et au nom du raccourci près. Un banc d'essai préparé autrement
      # n'éprouve pas la production : il éprouve autre chose.
      - name: Prépare le PWA du banc d'essai
        run: |
          python3 scripts/prepare_pwa.py \
            --out site-test \
            --environment validation \
            --version "${GITHUB_SHA::7}"

      # Garde-fou, et pas une formalité : ce workflow a le droit de déployer
      # sur Firebase. Si jamais la configuration d'environnement partait avec
      # les valeurs de production, ce site-ci appellerait la tablette de Jean
      # depuis une adresse censée ne jamais la joindre — une confusion pire
      # que celle qu'on cherche à éviter, puisque personne ne s'en méfierait.
      - name: Vérifie que ce site ne vise pas la production
        run: |
          echo "--- site-test/environment.js ---"
          cat site-test/environment.js
          grep -q '"validation"' site-test/environment.js
          grep -q 'test_tablet' site-test/environment.js
          grep -q 'calls_test' site-test/environment.js
          if grep -q 'jean_tablet' site-test/environment.js; then
            echo "REFUS : le PWA d'essai désigne la tablette de production." >&2
            exit 1
          fi
          echo "Vérifié : ce site ne peut atteindre que la tablette d'essai."

      # Les maquettes voyagent avec le banc d'essai plutôt que sur un
      # hébergeur de plus. Elles servent à juger une lisibilité ou une
      # disposition AVANT de les écrire en Kotlin, et cela se fait sur un
      # téléphone — donc il leur faut une adresse publique, sans compte à
      # ouvrir ni fichier à télécharger.
      #
      # Enveloppées à la publication : écrites pour le service d'artefacts,
      # elles n'ont pas de doctype, et un navigateur les rendrait en mode de
      # compatibilité — une géométrie différente de celle qui a été vérifiée
      # (voir scripts/enveloppe_maquette.py).
      - name: Publie les maquettes
        run: |
          shopt -s nullglob
          fichiers=(maquettes/*.html)
          if [ ${#fichiers[@]} -eq 0 ]; then
            echo "Aucune maquette à publier."
            exit 0
          fi
          for f in "${fichiers[@]}"; do
            python3 scripts/enveloppe_maquette.py "$f" site-test/maquettes
          done
          {
            echo "### Maquettes publiées"
            echo
            for f in "${fichiers[@]}"; do
              echo "- <https://seniorvisio-test.web.app/maquettes/$(basename "$f")>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déploie sur Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json
          # --only hosting:test, jamais un déploiement nu : firebase.json
          # décrit aussi les règles Firestore et les fonctions, et un `deploy`
          # sans portée les republierait toutes les deux depuis cette branche.
          npx firebase-tools deploy --only hosting:test \
            --project seniorvisio --non-interactive --force

      # ═══ VÉRIFIER CE QUI EST SERVI, ET NON CE QU'ON A DEMANDÉ ═══
      #
      # Un déploiement « réussi » dit seulement que les fichiers sont partis.
      # Il ne dit pas que la page d'entrée sera rechargée par les navigateurs
      # — or c'est exactement là que ça s'est cassé : l'en-tête anti-cache
      # visait « /index.html » alors que tout le monde ouvre « / ».
      #
      # Ce pas interroge l'adresse réelle et imprime ce qui en revient. Un
      # en-tête absent n'apparaît pas dans un fichier de configuration : il
      # n'apparaît que dans une réponse.
      - name: Vérifie que la page d'entrée n'est pas mise en cache
        run: |
          # Laisser la release se propager : Firebase répond parfois encore
          # l'ancienne version pendant une poignée de secondes.
          sleep 10
          echo "### Cache de la page d'entrée" >> "$GITHUB_STEP_SUMMARY"
          # Noms de variables SANS ACCENT : bash n'accepte que [A-Za-z0-9_]
          # dans un identifiant. « entêtes=... » n'était pas une affectation
          # mais une commande à exécuter, et ce pas est mort sur « No such
          # file or directory » — en emportant le déploiement avec lui. Le
          # reste du dépôt écrit en français ; ici, le shell impose l'ASCII.
          for chemin in "/" "/index.html"; do
            entetes=$(curl -sS -D - -o /dev/null "https://seniorvisio-test.web.app${chemin}" || true)
            cache=$(printf '%s' "$entetes" | grep -i '^cache-control:' | tr -d '\r' || true)
            echo "$chemin → ${cache:-aucun en-tête Cache-Control}"
            echo "- \`${chemin}\` → \`${cache:-aucun}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          # La version réellement servie, à comparer avec le commit ci-dessous :
          # deux nombres qui divergent disent une livraison qui n'a pas pris.
          # Suffixe unique : sans lui on interrogerait le cache du réseau de
          # diffusion, et le pas confirmerait joyeusement l'ancienne version.
          servie=$(curl -sS "https://seniorvisio-test.web.app/version.js?ci=${GITHUB_SHA}" || true)
          echo "version.js servi : $servie"
          echo "- servi : \`$(printf '%s' "$servie" | tr -d '\n')\`" >> "$GITHUB_STEP_SUMMARY"

          # Le seul verdict qui compte, et il échoue bruyamment.
          #
          # Le déploiement, lui, a déjà eu lieu : ce rouge ne défait rien, il
          # signale que la prochaine livraison n'arrivera pas dans les
          # navigateurs. Sans ce garde-fou, l'en-tête a pu viser une adresse
          # que personne n'ouvre pendant des semaines, en silence.
          racine=$(curl -sS -D - -o /dev/null "https://seniorvisio-test.web.app/" || true)
          if ! printf '%s' "$racine" | grep -iq '^cache-control:.*no-cache'; then
            echo "::error::La page d'entrée « / » n'est PAS servie en no-cache. Les navigateurs continueront de servir l'ancienne version." >&2
            exit 1
          fi
          echo "Vérifié : « / » est servi en no-cache."

      - name: Rappeler l'adresse
        run: |
          echo "### Banc d'essai déployé" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://seniorvisio-test.web.app>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branche \`${{ github.ref_name }}\`, commit \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
