name: Generate Device Owner provisioning QR code

# Génère le QR code de provisioning Android (scanné au tout premier démarrage
# d'une tablette fraîchement réinitialisée, voir README > Kiosque et
# déploiement) sans jamais faire transiter le mot de passe Wi-Fi par la
# conversation avec l'assistant : le SSID est passé en paramètre (non
# sensible, diffusé publiquement par la box elle-même), le mot de passe vient
# du secret WIFI_PASSWORD du dépôt.
#
# wifi_ssid est optionnel : laissé vide (cas le plus courant, le lieu de
# déploiement n'étant connu qu'une fois sur place), Android affiche son
# propre écran de sélection Wi-Fi pendant le provisioning, à renseigner
# directement sur la tablette.

on:
  push:
    paths:
      - '.github/workflows/generate-provisioning-qr.yml'
  workflow_dispatch:
    inputs:
      wifi_ssid:
        description: "Nom du réseau Wi-Fi (SSID) — laisser vide pour le saisir sur la tablette elle-même pendant le provisioning"
        required: false
        type: string
      apk_url:
        description: "URL de téléchargement de l'APK à utiliser pour le provisioning"
        required: true
        type: string
      admin_component:
        description: "Composant DeviceAdminReceiver (par défaut : Senior Visio)"
        required: false
        type: string
        default: "com.seniorvisio/.admin.SeniorVisioDeviceAdminReceiver"

jobs:
  generate-qr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android build-tools (pour apksigner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          echo "APKSIGNER=$ANDROID_HOME/build-tools/34.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Install qrcode
        run: pip install "qrcode[pil]"

      - name: Download target APK
        run: curl -L -o target.apk "${{ inputs.apk_url }}"

      - name: Build provisioning QR code
        env:
          WIFI_SSID: ${{ inputs.wifi_ssid }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          APK_URL: ${{ inputs.apk_url }}
          ADMIN_COMPONENT: ${{ inputs.admin_component }}
        run: python3 scripts/generate_provisioning_qr.py

      - name: Upload QR code
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-qr
          path: provisioning-qr.png
          retention-days: 1
