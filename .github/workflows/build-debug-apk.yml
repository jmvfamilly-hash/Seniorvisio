name: Build debug APK

on:
  push:
    # Le banc d'essai a sa propre chaîne (voir build-papyrus-apk.yml). Sans
    # cette exclusion, un commit qui ne touche que lui reconstruirait Senior
    # Visio ET demanderait une mise à jour à distance de la tablette de Jean —
    # pour un code inchangé.
    paths-ignore:
      - 'papyrus/**'
      - '.github/workflows/build-papyrus-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK platform & build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Vérifier la présence des secrets (sans jamais afficher leur valeur)
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          GLADIA_API_KEY: ${{ secrets.GLADIA_API_KEY }}
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
          SPEECH_TRACE_KEY: ${{ secrets.SPEECH_TRACE_KEY }}
        run: |
          echo "ASSEMBLYAI_API_KEY : ${#ASSEMBLYAI_API_KEY} caractère(s)"
          echo "GLADIA_API_KEY : ${#GLADIA_API_KEY} caractère(s)"
          echo "PICOVOICE_ACCESS_KEY : ${#PICOVOICE_ACCESS_KEY} caractère(s)"
          echo "SPEECH_TRACE_KEY : ${#SPEECH_TRACE_KEY} caractère(s)"

      - name: Build debug APK
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          GLADIA_API_KEY: ${{ secrets.GLADIA_API_KEY }}
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
          SPEECH_TRACE_KEY: ${{ secrets.SPEECH_TRACE_KEY }}
        run: |
          gradle assembleDebug --stacktrace \
            "-PbuildRev=rev${{ github.run_number }}" \
            "-PassemblyAiApiKey=${ASSEMBLYAI_API_KEY}" \
            "-PgladiaApiKey=${GLADIA_API_KEY}" \
            "-PpicovoiceAccessKey=${PICOVOICE_ACCESS_KEY}" \
            "-PspeechTraceKey=${SPEECH_TRACE_KEY}"

      - name: Rename APK with revision number
        run: |
          apk_name="seniorvisio-rev${{ github.run_number }}.apk"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$apk_name"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: senior-visio-debug-apk
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-apk-${{ github.run_id }}"
          gh release create "$tag" "app/build/outputs/apk/debug/${{ env.APK_NAME }}" \
            --title "Senior Visio debug APK (run ${{ github.run_number }})" \
            --notes "Build automatique du module app/ en mode debug, commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
          echo "APK_URL=https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.APK_NAME }}" >> "$GITHUB_ENV"

      # Ferme la boucle "mise à jour à distance" (voir DeviceStatusReporter.
      # listenForRemoteUpdate, déjà actif en continu côté tablette dès qu'elle
      # est Device Owner) : sans cette étape, rien ne renseignait jamais le
      # champ Firestore qu'elle écoute, il fallait le faire à la main
      # (console Firebase).
      #
      # UNE SEULE BRANCHE, ET C'EST LA LIGNE PRINCIPALE.
      #
      # test-audio-refonte a livré ici pendant la mise au point du son, à la
      # demande explicite de l'administrateur : le routage audio de cette
      # tablette ne se vérifiait pas autrement. LA TABLETTE EST DÉSORMAIS CHEZ
      # LE SENIOR, EN SERVICE. Une branche de travail qui s'y installe toute
      # seule n'est plus un raccourci de mise au point, c'est un risque pour
      # quelqu'un qui n'a aucun moyen de comprendre ni de signaler une panne.
      #
      # Ce qui remplace ce raccourci : une seconde tablette, un second jeu de
      # documents Firestore, et une version dédiée qui ne peut pas atteindre
      # celle-ci (voir DEVICE_DOC_PATH et scripts/request_remote_update.js).
      #
      # Nommée explicitement, jamais un motif : un joker ferait livrer chez le
      # senior la première branche de travail venue, et le garde-fou ne se
      # remarquerait qu'après.
      - name: Set up Node.js
        if: github.ref == 'refs/heads/AssemblyAI'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Demande la mise à jour à distance de la tablette
        if: github.ref == 'refs/heads/AssemblyAI'
        env:
          BUILD_REV: rev${{ github.run_number }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json
          npm install firebase-admin --no-save --silent
          node scripts/request_remote_update.js
