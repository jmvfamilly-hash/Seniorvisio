name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK platform & build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Sans ça, chaque run GitHub Actions repart d'une VM neuve : Android
      # Gradle Plugin génère alors une nouvelle clé de signature debug à
      # chaque build (aucun ~/.android/debug.keystore préexistant), ce qui
      # rend impossible une mise à jour "adb install -r" par-dessus une
      # tablette déjà provisionnée sans redésenrôler/réenrôler en Device
      # Owner (adb refuse une mise à jour avec une signature différente).
      # Clé de cache fixe (pas basée sur un hash de fichier) : le fichier
      # n'existe pas encore lors du tout premier run, et on veut justement la
      # même clé pour tous les runs suivants, pas une par variation de code.
      - name: Cache la clé de signature debug (mises à jour adb en place)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Vérifier la présence des secrets (sans jamais afficher leur valeur)
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          echo "ASSEMBLYAI_API_KEY : ${#ASSEMBLYAI_API_KEY} caractère(s)"

      - name: Build debug APK
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          gradle assembleDebug --stacktrace \
            "-PbuildRev=rev${{ github.run_number }}" \
            "-PassemblyAiApiKey=${ASSEMBLYAI_API_KEY}"

      - name: Rename APK with revision number
        run: |
          apk_name="seniorvisio-rev${{ github.run_number }}.apk"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$apk_name"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: senior-visio-debug-apk
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-apk-${{ github.run_id }}"
          gh release create "$tag" "app/build/outputs/apk/debug/${{ env.APK_NAME }}" \
            --title "Senior Visio debug APK (run ${{ github.run_number }})" \
            --notes "Build automatique du module app/ en mode debug, commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
