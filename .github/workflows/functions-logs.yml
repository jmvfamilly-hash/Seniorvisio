name: Fetch Cloud Functions logs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/functions-logs.yml'

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json

      - name: Fetch function logs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: npx firebase-tools functions:log --project seniorvisio -n 200

      # Diagnostic temporaire (voir « pas de sms », branche
      # travail/appel-sortant-aidant) : les logs ne montrent plus aucune
      # invocation d'AUCUNE des trois fonctions déclenchées par Firestore,
      # pas seulement envoyerRappelAidantTest, depuis le déploiement qui a
      # introduit cette dernière. Interroge directement Eventarc pour voir
      # si les déclencheurs existent et sont en état ACTIVE, plutôt que de
      # continuer à deviner depuis l'absence de logs.
      - name: Diagnostic Eventarc
        run: |
          gcloud auth activate-service-account --key-file=/tmp/firebase-key.json
          gcloud config set project seniorvisio
          echo "--- Logs Cloud Run bruts (toutes sévérités, pas seulement les logs structurés de la fonction) : envoyerrappelaidanttest, dernière heure ---"
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="envoyerrappelaidanttest"' \
            --project=seniorvisio --freshness=1h --format="table(timestamp,severity,textPayload,httpRequest.status)" --limit=100
          echo "--- Même requête pour notifyincomingcall, dernière heure (pour comparaison) ---"
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="notifyincomingcall"' \
            --project=seniorvisio --freshness=1h --format="table(timestamp,severity,textPayload,httpRequest.status)" --limit=100
          echo "--- Messages Pub/Sub non livrés (dead-letter / nack) sur l'abonnement envoyerrappelaidanttest ---"
          gcloud logging read 'resource.type="pubsub_subscription" AND resource.labels.subscription_id:"envoyerrappelaidanttest"' \
            --project=seniorvisio --freshness=1h --format="table(timestamp,severity,jsonPayload,textPayload)" --limit=50
