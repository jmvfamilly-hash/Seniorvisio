name: Fetch Cloud Functions logs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/functions-logs.yml'

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json

      - name: Fetch function logs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: npx firebase-tools functions:log --project seniorvisio -n 200

      # firebase-tools functions:log n'affiche pas les logs de niveau
      # erreur (console.error) de toutes les fonctions — vu en pratique en
      # diagnostiquant « pas de sms » : les échecs Twilio n'apparaissaient
      # que via les logs Cloud Run bruts, jamais via la commande ci-dessus.
      - name: Fetch raw Cloud Run logs (dernière heure, toutes sévérités)
        run: |
          gcloud auth activate-service-account --key-file=/tmp/firebase-key.json
          gcloud config set project seniorvisio
          gcloud logging read 'resource.type="cloud_run_revision"' \
            --project=seniorvisio --freshness=1h --format="table(resource.labels.service_name,timestamp,severity,textPayload)" --limit=100

      # Diagnostic temporaire : la dernière invocation de
      # envoyerrappelaidanttest (après la levée du mode essai Twilio)
      # n'a produit NI succès NI erreur dans le flux ci-dessus, alors que
      # la même révision avait loggé une erreur Twilio proprement lors de
      # l'essai précédent. Vue complète (code HTTP, jsonPayload inclus,
      # sévérité DEFAULT et plus) pour voir si l'exécution a planté ou
      # expiré sans rien écrire dans textPayload.
      - name: Diagnostic détaillé envoyerrappelaidanttest
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="envoyerrappelaidanttest" AND severity>=DEFAULT' \
            --project=seniorvisio --freshness=15m --format=json --limit=50
