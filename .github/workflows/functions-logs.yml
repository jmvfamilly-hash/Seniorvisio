name: Fetch Cloud Functions logs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/functions-logs.yml'

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json

      - name: Fetch function logs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: npx firebase-tools functions:log --project seniorvisio -n 200

      # firebase-tools functions:log n'affiche pas les logs de niveau
      # erreur (console.error) de toutes les fonctions — vu en pratique en
      # diagnostiquant un échec d'envoi : les erreurs n'apparaissaient que
      # via les logs Cloud Run bruts, jamais via la commande ci-dessus.
      - name: Fetch raw Cloud Run logs (dernière heure, toutes sévérités)
        run: |
          gcloud auth activate-service-account --key-file=/tmp/firebase-key.json
          gcloud config set project seniorvisio
          gcloud logging read 'resource.type="cloud_run_revision"' \
            --project=seniorvisio --freshness=1h --format="table(resource.labels.service_name,timestamp,severity,textPayload)" --limit=100
