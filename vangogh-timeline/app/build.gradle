plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vangoghtimeline'
    compileSdk 34

    defaultConfig {
        applicationId "com.vangoghtimeline"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Passé par la CI (-PbuildRev=revNN), même numéro que le nom de l'APK publié.
        buildConfigField "String", "BUILD_REV", "\"${project.findProperty('buildRev') ?: 'dev'}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        // Imposé par Kotlin 1.9.24.
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation project(':iiif-viewer-lib')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Lecture des manifestes IIIF : arbre JSON (JsonElement), sans plugin de sérialisation.
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    // Fondation + animation (inertie), sans Material : la frise est une mise en page sur mesure.
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui'

    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Modèle, échelle du temps, couloirs, parseur IIIF : aucun import Android, vérifiés sur la machine qui compile.
    testImplementation 'junit:junit:4.13.2'
    // le validateur d'accès lit les manifestes avec le résolveur de la bibliothèque (org.json, absent des tests JVM Android)
    testImplementation 'org.json:json:20231013'
}
