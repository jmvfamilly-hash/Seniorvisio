// Projet Gradle autonome, comme papyrus/ : le visualiseur IIIF n'est pas
// embarqué dans Senior Visio, il se compile, se teste et s'installe seul.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "IiifViewer"
include ':app'
