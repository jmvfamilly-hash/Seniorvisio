plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Bibliothèque du visualiseur IIIF : l'application de démonstration (app/) et la frise Van Gogh
// (vangogh-timeline/, qui l'inclut depuis son settings.gradle) l'utilisent toutes les deux.
android {
    // Distinct de celui de l'application : AGP refuse deux modules de même namespace.
    // Les paquets Kotlin restent `com.iiifviewer`.
    namespace 'com.iiifviewer.lib'
    compileSdk 34

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui'

    // Le calcul de tuiles, le planificateur et le cache n'importent rien d'Android : ils se vérifient sans émulateur.
    testImplementation 'junit:junit:4.13.2'
    // org.json est fourni par Android à l'exécution ; sur la JVM des essais, il faut la vraie bibliothèque.
    testImplementation 'org.json:json:20231013'
}
