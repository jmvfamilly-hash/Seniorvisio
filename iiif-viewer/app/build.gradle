plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.iiifviewer'
    compileSdk 34

    defaultConfig {
        applicationId "com.iiifviewer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Passé par la CI (-PbuildRev=revNN), même numéro que le nom de l'APK publié.
        buildConfigField "String", "BUILD_REV", "\"${project.findProperty('buildRev') ?: 'dev'}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation project(':library')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    // Fondation + animation (inertie, double-tap), sans Material : l'écran est
    // un Canvas plein écran.
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui'

}
