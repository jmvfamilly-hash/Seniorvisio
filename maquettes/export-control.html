<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export Control – Registre multi-juridictions</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--ink:#1c2430;--mute:#64707f;--line:#dde3ea;--brand:#1f4e8c;--brand-ink:#fff;
  --ok:#17803d;--ok-bg:#e3f4e9;--warn:#b25e00;--warn-bg:#fdf0dc;--bad:#b3261e;--bad-bg:#fbe4e2;--chip:#eaeef3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171e;--panel:#1b222c;--ink:#e6ebf1;--mute:#94a0ae;--line:#2c3644;--brand:#5b9bf0;--brand-ink:#0b1320;
  --ok:#5fd18a;--ok-bg:#16301f;--warn:#f0b04d;--warn-bg:#35280f;--bad:#ff8a80;--bad-bg:#3a1a18;--chip:#263140;
}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh}
nav h1{font-size:15px;margin:0 8px 18px;line-height:1.25}
nav h1 small{display:block;font-weight:400;color:var(--mute);font-size:11px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav button:hover{background:var(--chip)}
nav button.on{background:var(--brand);color:var(--brand-ink)}
main{padding:20px 24px;min-width:0}
h2{margin:0 0 14px;font-size:20px}
h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font-size:26px}
.kpi span{color:var(--mute);font-size:12px}
.kpi.red b{color:var(--bad)}.kpi.orange b{color:var(--warn)}.kpi.green b{color:var(--ok)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.spacer{flex:1}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--chip)}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.green{background:var(--ok-bg);color:var(--ok)}
.badge.orange{background:var(--warn-bg);color:var(--warn)}
.badge.red{background:var(--bad-bg);color:var(--bad)}
.chip{display:inline-block;background:var(--chip);border-radius:5px;padding:1px 7px;margin:1px 3px 1px 0;font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
label+input,label+select{width:100%}
.tip{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;background:var(--chip);color:var(--mute);font-size:11px;cursor:help;position:relative;margin-left:4px;font-style:normal}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:20px;top:-4px;width:260px;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.35;z-index:9;text-transform:none;letter-spacing:0;font-weight:400}
.alert{padding:9px 12px;border-radius:6px;margin-bottom:6px;border-left:4px solid}
.alert.red{background:var(--bad-bg);border-color:var(--bad)}
.alert.orange{background:var(--warn-bg);border-color:var(--warn)}
.alert.green{background:var(--ok-bg);border-color:var(--ok)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.hist li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist time{color:var(--mute);margin-right:6px}
ul{list-style:none;margin:0;padding:0}
.empty{color:var(--mute);padding:18px;text-align:center}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav{position:static;height:auto;display:flex;gap:4px;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
  nav h1{width:100%}nav button{width:auto}
  main{padding:16px}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1>Export Control<small>Registre multi-juridictions · prototype</small></h1>
    <button data-v="dash" class="on">Tableau de bord</button>
    <button data-v="edit">Fiche actif</button>
    <button data-v="hist">Historique</button>
  </nav>
  <main id="main"></main>
</div>

<script>
"use strict";
const JURIS = [
  {key:'US-EAR', name:'États-Unis', regime:'EAR', tip:'Export Administration Regulations (BIS). Codes ECCN, ex. 5D002 ; EAR99 = non listé.'},
  {key:'US-ITAR', name:'États-Unis', regime:'ITAR', tip:'International Traffic in Arms Regulations (DDTC). Catégories USML, ex. XI(a)(4). Licence quasi systématique.'},
  {key:'EU', name:'Union européenne', regime:'Dual-use', tip:'Règlement (UE) 2021/821 sur les biens à double usage, Annexe I (même structure que les ECCN).'},
  {key:'FR', name:'France', regime:'National', tip:'Contrôle national (SBDU / DGE) : biens à double usage et matériels de guerre.'},
  {key:'UK', name:'Royaume-Uni', regime:'UK Strategic Export Controls', tip:'UK Strategic Export Control Lists (ECJU).'},
  {key:'DE', name:'Allemagne', regime:'AWV / BAFA', tip:'Ausfuhrliste (BAFA) en complément du règlement UE.'}
];
const STATUSES = ['NLR','Licence requise','Interdit','À déterminer'];
const STATUS_TIP = 'NLR : aucune licence requise. Licence requise : autorisation préalable. Interdit : exportation impossible vers la destination visée.';
const TYPES = ['Logiciel','Composant','Documentation technique','Base de code','Technologie'];
const CLASSIF = ['Public','Interne','Confidentiel','Secret affaires'];

const j = (key,code,status)=>({key,code,status});
const SEED = [
  {id:1,name:'CryptoCore – moteur de chiffrement',type:'Logiciel',owner:'A. Martin',project:'Sentinel',classif:'Confidentiel',
   juris:[j('US-EAR','5D002','NLR'),j('EU','5D002','Licence requise'),j('FR','5D002','Licence requise')],
   notes:'Exception ENC (740.17) applicable côté US ; autorisation SBDU en cours côté UE/FR.'},
  {id:2,name:'Documentation API publique',type:'Documentation technique',owner:'C. Leroy',project:'Portal',classif:'Public',
   juris:[j('US-EAR','EAR99','NLR'),j('EU','Non listé','NLR')],notes:'Information publiée, hors champ.'},
  {id:3,name:'Firmware radar RX-9',type:'Composant',owner:'S. Bernard',project:'Aegis',classif:'Secret affaires',
   juris:[j('US-ITAR','XI(a)(4)','Licence requise'),j('EU','','À déterminer')],notes:''},
  {id:4,name:'Base de code ML – vision',type:'Base de code',owner:'N. Dubois',project:'Lynx',classif:'Interne',
   juris:[j('US-EAR','EAR99','NLR'),j('EU','4E001','Licence requise')],notes:''},
  {id:5,name:'Outil de supervision réseau',type:'Logiciel',owner:'A. Martin',project:'Sentinel',classif:'Interne',
   juris:[j('US-EAR','5D992','NLR'),j('EU','','À déterminer'),j('FR','','À déterminer')],notes:'Classification UE/FR à instruire.'}
];

// ---------- état + persistance (localStorage optionnel) ----------
let db, history, view='dash', cur=null, filt={q:'',jur:'',risk:'',status:''};
try{db=JSON.parse(localStorage.getItem('ec_db'));history=JSON.parse(localStorage.getItem('ec_hist'))}catch(e){}
if(!Array.isArray(db)){db=JSON.parse(JSON.stringify(SEED));history=[
  {ts:Date.now()-864e5*3,asset:'CryptoCore – moteur de chiffrement',msg:'Création de la fiche'},
  {ts:Date.now()-864e5,asset:'CryptoCore – moteur de chiffrement',msg:'UE : statut NLR → Licence requise'}]}
if(!Array.isArray(history))history=[];
function persist(){try{localStorage.setItem('ec_db',JSON.stringify(db));localStorage.setItem('ec_hist',JSON.stringify(history))}catch(e){}}

// ---------- utilitaires ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jinfo=k=>JURIS.find(x=>x.key===k);
const jlabel=k=>{const x=jinfo(k);return x?`${x.name} (${x.regime})`:k};
const tip=t=>`<i class="tip" tabindex="0" data-tip="${esc(t)}">?</i>`;
const LV={green:0,orange:1,red:2}, LBL={green:'Conforme',orange:'À surveiller',red:'Risque élevé'};
const badge=l=>`<span class="badge ${l}">${LBL[l]}</span>`;
const fmt=ts=>new Date(ts).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const controlled=x=>x.code.trim()&&!/^(EAR99|NLR|non listé|-)$/i.test(x.code.trim());

// ---------- moteur de conformité ----------
function evaluate(a){
  const out=[], add=(l,m)=>out.push({l,m});
  if(!a.juris.length) add('orange','Aucune juridiction renseignée.');
  a.juris.forEach(x=>{
    const n=jlabel(x.key);
    if(!x.code.trim()) add('orange',`${n} : code export non renseigné.`);
    if(x.key==='US-ITAR') add('red',`${n} : actif relevant de l'USML — licence DDTC requise, vérifier le statut des tiers/nationalités.`);
    if(x.status==='Interdit') add('red',`${n} : exportation interdite.`);
    else if(x.status==='Licence requise') add('orange',`${n} : licence requise${x.code?` (code ${x.code})`:''}.`);
    else if(x.status==='À déterminer') add('orange',`${n} : statut de licence à déterminer.`);
  });
  const filled=a.juris.filter(x=>x.code.trim()&&!/ITAR/.test(x.key));
  const hasC=filled.some(controlled), hasN=filled.some(x=>!controlled(x));
  if(hasC&&hasN){
    const c=filled.filter(controlled).map(x=>`${x.key} ${x.code}`).join(', ');
    const n=filled.filter(x=>!controlled(x)).map(x=>`${x.key} ${x.code}`).join(', ');
    add('orange',`Divergence de classification : contrôlé (${c}) vs non contrôlé (${n}).`);
  }
  const eu=filled.find(x=>x.key==='EU'), us=filled.find(x=>x.key==='US-EAR');
  if(eu&&us&&controlled(eu)&&controlled(us)&&eu.code.trim().toUpperCase()!==us.code.trim().toUpperCase())
    add('orange',`Codes US (${us.code}) et UE (${eu.code}) différents : vérifier l'équivalence.`);
  const level=out.reduce((m,o)=>LV[o.l]>LV[m]?o.l:m,'green');
  if(level!=='green'&&!a.notes.trim()) {out.push({l:'orange',m:'Justification réglementaire manquante : documentez la décision.'});}
  const fin=out.reduce((m,o)=>LV[o.l]>LV[m]?o.l:m,'green');
  if(!out.length) out.push({l:'green',m:'Aucune incohérence détectée. Classification cohérente sur toutes les juridictions.'});
  return {level:fin,issues:out};
}

// ---------- navigation ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  if(b.dataset.v==='edit'&&!cur) return newAsset();
  go(b.dataset.v)});
function go(v){
  view=v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ({dash:renderDash,edit:renderEdit,hist:renderHist})[v]();
}

// ---------- tableau de bord ----------
function renderDash(){
  const rows=db.map(a=>({a,ev:evaluate(a)}));
  const cnt=l=>rows.filter(r=>r.ev.level===l).length;
  const shown=rows.filter(({a,ev})=>{
    const q=filt.q.toLowerCase();
    if(q&&!(`${a.name} ${a.owner} ${a.project} ${a.juris.map(x=>x.code).join(' ')}`.toLowerCase().includes(q)))return false;
    if(filt.jur&&!a.juris.some(x=>x.key===filt.jur))return false;
    if(filt.risk&&ev.level!==filt.risk)return false;
    if(filt.status&&!a.juris.some(x=>x.status===filt.status))return false;
    return true});
  $('#main').innerHTML=`
  <h2>Tableau de bord</h2>
  <div class="kpis">
    <div class="kpi"><b>${db.length}</b><span>Actifs référencés</span></div>
    <div class="kpi green"><b>${cnt('green')}</b><span>Conformes</span></div>
    <div class="kpi orange"><b>${cnt('orange')}</b><span>À surveiller</span></div>
    <div class="kpi red"><b>${cnt('red')}</b><span>Risque élevé</span></div>
  </div>
  <div class="card">
    <div class="bar">
      <input id="fq" type="search" placeholder="Rechercher actif, code, projet…" value="${esc(filt.q)}" style="min-width:220px">
      <select id="fj"><option value="">Toutes juridictions</option>${JURIS.map(x=>`<option value="${x.key}" ${filt.jur===x.key?'selected':''}>${esc(jlabel(x.key))}</option>`).join('')}</select>
      <select id="fs"><option value="">Tous statuts</option>${STATUSES.map(s=>`<option ${filt.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="fr"><option value="">Tous niveaux</option>${Object.keys(LBL).map(l=>`<option value="${l}" ${filt.risk===l?'selected':''}>${LBL[l]}</option>`).join('')}</select>
      <span class="spacer"></span>
      <button class="btn ghost" id="csv">Exporter CSV</button>
      <button class="btn" id="new">+ Nouvel actif</button>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Actif</th><th>Type</th><th>Propriétaire</th><th>Juridictions · code · statut</th><th>Conformité</th></tr></thead>
      <tbody>${shown.map(({a,ev})=>`<tr class="click" data-id="${a.id}">
        <td><b>${esc(a.name)}</b><br><span style="color:var(--mute);font-size:12px">${esc(a.project)} · ${esc(a.classif)}</span></td>
        <td>${esc(a.type)}</td><td>${esc(a.owner)}</td>
        <td>${a.juris.map(x=>`<span class="chip">${esc(x.key)} · ${esc(x.code||'—')} · ${esc(x.status)}</span>`).join('')}</td>
        <td>${badge(ev.level)}</td></tr>`).join('')||''}</tbody>
    </table></div>
    ${shown.length?'':'<div class="empty">Aucun actif ne correspond aux filtres.</div>'}
  </div>`;
  const bind=(id,k,ev)=>$(id).addEventListener(ev,e=>{filt[k]=e.target.value;renderDash();
    if(k==='q'){const el=$('#fq');el.focus();el.setSelectionRange(el.value.length,el.value.length)}});
  bind('#fq','q','input');bind('#fj','jur','change');bind('#fs','status','change');bind('#fr','risk','change');
  $('#new').onclick=newAsset;
  $('#csv').onclick=()=>exportCsv(shown.map(r=>r.a));
  document.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>{cur=JSON.parse(JSON.stringify(db.find(a=>a.id==tr.dataset.id)));go('edit')});
}
function exportCsv(list){
  const cell=v=>`"${String(v).replace(/"/g,'""')}"`;
  const lines=[['Actif','Type','Propriétaire','Projet','Classification','Juridiction','Code','Statut','Conformité'].map(cell).join(';')];
  list.forEach(a=>{const lv=LBL[evaluate(a).level];
    (a.juris.length?a.juris:[{key:'',code:'',status:''}]).forEach(x=>
      lines.push([a.name,a.type,a.owner,a.project,a.classif,x.key?jlabel(x.key):'',x.code,x.status,lv].map(cell).join(';')))});
  const url=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  const l=document.createElement('a');l.href=url;l.download='export-control-registre.csv';l.click();URL.revokeObjectURL(url);
}

// ---------- fiche actif ----------
function newAsset(){
  cur={id:Date.now(),name:'',type:TYPES[0],owner:'',project:'',classif:CLASSIF[1],juris:[j('US-EAR','','À déterminer'),j('EU','','À déterminer')],notes:'',_new:true};
  go('edit');
}
function renderEdit(){
  if(!cur){go('dash');return}
  const a=cur;
  $('#main').innerHTML=`
  <h2>${a._new?'Nouvel actif':esc(a.name||'Fiche actif')}</h2>
  <div class="two"><div>
    <div class="card"><h3>1. Identification de la donnée</h3>
      <div class="grid">
        <div><label>Nom de l'actif</label><input id="f_name" value="${esc(a.name)}" placeholder="ex. Moteur de chiffrement"></div>
        <div><label>Type ${tip('Logiciel, composant, documentation technique, base de code ou technologie : la nature de l\'actif influence la catégorie applicable (ex. D = logiciel, E = technologie dans les ECCN).')}</label>
          <select id="f_type">${TYPES.map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label>Propriétaire</label><input id="f_owner" value="${esc(a.owner)}"></div>
        <div><label>Projet</label><input id="f_project" value="${esc(a.project)}"></div>
        <div><label>Classification interne</label><select id="f_classif">${CLASSIF.map(t=>`<option ${a.classif===t?'selected':''}>${t}</option>`).join('')}</select></div>
      </div></div>
    <div class="card"><h3>2. Codes export par juridiction ${tip(STATUS_TIP)}</h3>
      <div class="tw"><table><thead><tr><th>Juridiction</th><th>Code export</th><th>Statut de licence</th><th></th></tr></thead>
      <tbody id="jbody"></tbody></table></div>
      <div class="bar" style="margin:12px 0 0"><select id="addj"></select><button class="btn ghost" id="addbtn">+ Ajouter la juridiction</button></div>
    </div>
    <div class="card"><h3>4. Justification réglementaire ${tip('Documentez le raisonnement : critères techniques, exceptions invoquées (ex. ENC), décision de l\'autorité, référence de dossier.')}</h3>
      <textarea id="f_notes" placeholder="Base légale, exception invoquée, n° de dossier…">${esc(a.notes)}</textarea></div>
    <div class="bar">
      <button class="btn" id="save">Enregistrer</button>
      <button class="btn ghost" id="cancel">Retour</button>
      <span class="spacer"></span>
      ${a._new?'':'<button class="btn danger" id="del">Supprimer</button>'}
    </div>
  </div><div>
    <div class="card"><h3>3. Compliance Check</h3><div id="comp"></div></div>
    <div class="card"><h3>Historique de la fiche</h3><ul class="hist" id="ahist"></ul></div>
  </div></div>`;
  [['name'],['owner'],['project'],['notes']].forEach(([k])=>$('#f_'+k).oninput=e=>{a[k]=e.target.value;renderComp()});
  ['type','classif'].forEach(k=>$('#f_'+k).onchange=e=>{a[k]=e.target.value});
  $('#addbtn').onclick=()=>{const k=$('#addj').value;if(k){a.juris.push(j(k,'','À déterminer'));renderJuris();renderComp()}};
  $('#save').onclick=save;
  $('#cancel').onclick=()=>{cur=null;go('dash')};
  if($('#del'))$('#del').onclick=()=>{if(confirm('Supprimer cet actif ?')){
    db=db.filter(x=>x.id!==a.id);log(a.name,'Suppression de la fiche');persist();cur=null;go('dash')}};
  renderJuris();renderComp();
  const mine=history.filter(h=>h.asset===(a._orig||a.name)).sort((x,y)=>y.ts-x.ts);
  $('#ahist').innerHTML=mine.map(h=>`<li><time>${fmt(h.ts)}</time>${esc(h.msg)}</li>`).join('')||'<li style="color:var(--mute)">Aucune modification enregistrée.</li>';
  if(!a._orig&&!a._new)a._orig=a.name;
}
function renderJuris(){
  const a=cur;
  $('#jbody').innerHTML=a.juris.map((x,i)=>{const inf=jinfo(x.key);return `<tr>
    <td>${esc(jlabel(x.key))} ${tip(inf?inf.tip:'')}</td>
    <td><input data-i="${i}" data-f="code" value="${esc(x.code)}" placeholder="ex. 5D002 / EAR99" style="width:130px"></td>
    <td><select data-i="${i}" data-f="status">${STATUSES.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><button class="btn ghost" data-rm="${i}" aria-label="Retirer">×</button></td></tr>`}).join('')
    ||'<tr><td colspan="4" class="empty">Aucune juridiction.</td></tr>';
  $('#jbody').querySelectorAll('[data-f]').forEach(el=>el[el.tagName==='SELECT'?'onchange':'oninput']=e=>{a.juris[+el.dataset.i][el.dataset.f]=e.target.value;renderComp()});
  $('#jbody').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{a.juris.splice(+b.dataset.rm,1);renderJuris();renderComp()});
  const free=JURIS.filter(x=>!a.juris.some(y=>y.key===x.key));
  $('#addj').innerHTML=free.map(x=>`<option value="${x.key}">${esc(jlabel(x.key))}</option>`).join('');
  $('#addj').disabled=$('#addbtn').disabled=!free.length;
}
function renderComp(){
  const ev=evaluate(cur);
  $('#comp').innerHTML=`<div style="margin-bottom:10px">${badge(ev.level)}</div>`+
    ev.issues.map(o=>`<div class="alert ${o.l}">${esc(o.m)}</div>`).join('');
}
function log(asset,msg){history.push({ts:Date.now(),asset,msg})}
function save(){
  const a=cur;
  if(!a.name.trim()){alert("Le nom de l'actif est obligatoire.");$('#f_name').focus();return}
  const old=db.find(x=>x.id===a.id);
  if(!old)log(a.name,'Création de la fiche');
  else{
    const meta={name:'Nom',type:'Type',owner:'Propriétaire',project:'Projet',classif:'Classification',notes:'Justification'};
    Object.keys(meta).forEach(k=>{if(old[k]!==a[k])log(a.name,k==='notes'?'Justification mise à jour':`${meta[k]} : « ${old[k]} » → « ${a[k]} »`)});
    a.juris.forEach(x=>{const o=old.juris.find(y=>y.key===x.key);
      if(!o)log(a.name,`Ajout de ${x.key} (${x.code||'—'}, ${x.status})`);
      else{if(o.code!==x.code)log(a.name,`${x.key} : code ${o.code||'—'} → ${x.code||'—'}`);
           if(o.status!==x.status)log(a.name,`${x.key} : statut ${o.status} → ${x.status}`)}});
    old.juris.forEach(o=>{if(!a.juris.some(x=>x.key===o.key))log(a.name,`Retrait de ${o.key}`)});
  }
  const clean={...a};delete clean._new;delete clean._orig;
  const i=db.findIndex(x=>x.id===a.id);
  if(i<0)db.push(clean);else db[i]=clean;
  persist();cur=null;go('dash');
}

// ---------- historique global ----------
function renderHist(){
  const h=[...history].sort((a,b)=>b.ts-a.ts);
  $('#main').innerHTML=`<h2>Historique des modifications</h2><div class="card">
    <div class="bar"><span class="spacer"></span><button class="btn ghost" id="reset">Réinitialiser les données de démo</button></div>
    <div class="tw"><table><thead><tr><th>Date</th><th>Actif</th><th>Modification</th></tr></thead><tbody>
    ${h.map(x=>`<tr><td>${fmt(x.ts)}</td><td>${esc(x.asset)}</td><td>${esc(x.msg)}</td></tr>`).join('')}</tbody></table></div>
    ${h.length?'':'<div class="empty">Aucune modification.</div>'}</div>`;
  $('#reset').onclick=()=>{if(confirm('Revenir aux données de démo ?')){try{localStorage.removeItem('ec_db');localStorage.removeItem('ec_hist')}catch(e){}location.reload()}};
}

go('dash');
</script>
