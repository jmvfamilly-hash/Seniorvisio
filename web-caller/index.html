<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appeler Jean</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>Appeler Jean</h1>

    <div id="stateIdle" class="state">
      <button id="callButton">📹 Démarrer l'appel</button>
    </div>

    <div id="stateCalling" class="state hidden">
      <p>Appel en cours vers Jean…</p>
      <p class="hint" id="callingHint">Connexion à sa tablette…</p>
      <div class="progress-bar"><div class="progress-bar-fill" id="countdownFill"></div></div>
      <p class="countdown-text" id="countdownText"></p>
      <button id="cancelButton" class="secondary">Annuler</button>
    </div>

    <div id="stateBlocked" class="state hidden">
      <p>Jean a bloqué l'appel.</p>
      <button id="retryButton">Réessayer</button>
    </div>

    <div id="stateConnected" class="state hidden">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <pre id="callStats" class="stats"></pre>

      <div class="volume-control">
        <label for="volumeSlider">🔊 Volume chez Jean</label>
        <input type="range" id="volumeSlider" min="0" max="200" value="100" step="5">
      </div>

      <div class="caption-control">
        <label>
          <input type="checkbox" id="captionToggle">
          🔤 Afficher mes paroles en grand chez Jean
        </label>
      </div>

      <div class="volume-control">
        <label for="textSizeSlider">🔠 Taille du texte chez Jean</label>
        <input type="range" id="textSizeSlider" min="24" max="100" value="56" step="4">
      </div>

      <div class="transcript-mirror">
        <p class="transcript-hint">Ce que Jean va voir :</p>
        <p class="transcript-current" id="transcriptCurrent"></p>
        <p class="silence-indicator hidden" id="silenceIndicator">🔇 Aucun son détecté depuis quelques secondes</p>
        <ul class="transcript-history" id="transcriptHistory"></ul>
      </div>

      <button id="hangupButton" class="danger">Raccrocher</button>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="call-engine.js"></script>
  <script src="webrtc-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
